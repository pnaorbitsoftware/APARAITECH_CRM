{% extends "base.html" %}
{% block content %}
<h2><i class="fas fa-chart-line me-2"></i>Dashboard</h2>
<div class="row mt-3">
    <div class="col-md-3 mb-3"><div class="card bg-primary text-white"><div class="card-body"><h3>{{ total_leads }}</h3><p>Total Leads</p></div></div></div>
    <div class="col-md-3 mb-3"><div class="card bg-success text-white"><div class="card-body"><h3>{{ new_leads }}</h3><p>New Leads</p></div></div></div>
    <div class="col-md-3 mb-3"><div class="card bg-info text-white"><div class="card-body"><h3>{{ converted }}</h3><p>Converted</p></div></div></div>
    <div class="col-md-3 mb-3"><div class="card bg-warning text-dark"><div class="card-body"><h3>{{ total_forms }}</h3><p>Form Entries</p></div></div></div>
</div>
<div class="card"><div class="card-header">Quick Actions</div><div class="card-body">
    <a href="/leads" class="btn btn-primary">Manage Leads</a>
    <a href="/email" class="btn btn-success">Send Campaign</a>
    <a href="/forms" class="btn btn-info">View Form Data</a>
</div></div>
{% endblock %}
